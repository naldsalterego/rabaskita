name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: cat, POSTGRES_DB: cat_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { DATABASE_URL: 'postgresql://postgres:cat@localhost:5432/cat_test' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y postgresql-client && psql $DATABASE_URL -v ON_ERROR_STOP=1 -f database/schema.sql
      - run: cd server && npm install && npm test
      - run: cd client && npm install && npm run build
