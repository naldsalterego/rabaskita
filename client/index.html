<style>
#splash{--r:0px;position:fixed;inset:0;z-index:9999;overflow:hidden;background:linear-gradient(#6fd3f3 0%,#b9ecf2 45%,#ffe7ae 78%,#ffc99a 100%);transition:opacity .4s ease,visibility .4s}
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
#splash .ring{position:absolute;left:var(--cx,50%);top:var(--cy,45%);width:188vmax;height:188vmax;margin:-94vmax 0 0 -94vmax;border-radius:50%;border:clamp(5px,1.2vmin,10px) solid #FFC21A;box-sizing:border-box;transform:scale(0);opacity:0;pointer-events:none}
#splash.out{transition:none;-webkit-mask-image:radial-gradient(circle at var(--cx,50%) var(--cy,45%),transparent var(--r),#000 calc(var(--r) + 28px));mask-image:radial-gradient(circle at var(--cx,50%) var(--cy,45%),transparent var(--r),#000 calc(var(--r) + 28px));animation:sp-iris 2.1s cubic-bezier(.5,0,.5,1) forwards}
#splash.out .ring{opacity:1;animation:sp-ring 2.1s cubic-bezier(.5,0,.5,1) forwards}
#splash.out .logo{animation:sp-zoom 2.1s cubic-bezier(.5,0,.5,1) forwards}
#splash.out .tag{animation:sp-gone .5s ease forwards}
#splash.fade{opacity:0;visibility:hidden}
@keyframes sp-iris{from{--r:0px}to{--r:94vmax}}
@keyframes sp-ring{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes sp-zoom{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.35)}}
@keyframes sp-gone{to{opacity:0;transform:translateY(12px)}}
#splash svg.scene{position:absolute;inset:0;width:100%;height:100%}
#splash .logo{position:absolute;left:50%;top:41%;width:min(66vw,380px);transform:translate(-50%,-50%);animation:sp-pop .8s cubic-bezier(.2,1.5,.4,1) .45s both}
#splash .logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 14px rgba(37,48,143,.25));animation:sp-bob 1.4s ease-in-out 1.3s infinite}
#splash .tag{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:700 clamp(20px,4.6vw,30px)/1 Fredoka,system-ui,sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #25308F,0 4px 10px rgba(37,48,143,.4);animation:sp-up .5s cubic-bezier(.2,1.4,.4,1) 1.5s both}
#splash .tag b{color:#FFC21A}
#splash .wait{position:absolute;left:0;right:0;bottom:calc(7% - 26px);display:flex;justify-content:center;gap:8px;opacity:0;animation:sp-fadein .4s ease 3s forwards}
#splash .wait i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(37,48,143,.5);animation:sp-dot .8s ease-in-out infinite}
#splash .wait i:nth-child(2){animation-delay:.15s}#splash .wait i:nth-child(3){animation-delay:.3s}
@keyframes sp-fadein{to{opacity:1}}@keyframes sp-dot{50%{transform:translateY(-8px);background:#FFC21A}}
#splash.out .wait,#splash.fade .wait{display:none}
#splash .spark{position:absolute;left:50%;top:41%;width:12px;height:12px;margin:-6px;border-radius:3px;background:var(--c);opacity:0;animation:sp-burst .9s ease-out .75s both}
.sun{transform-origin:400px 300px;animation:sp-rise 1s cubic-bezier(.2,.9,.3,1) both}
.rays{transform-origin:400px 300px;animation:sp-spin 6s linear infinite}
.mtn{animation:sp-slide .8s cubic-bezier(.2,.9,.3,1) .1s both}
.mtn2{animation:sp-slide .8s cubic-bezier(.2,.9,.3,1) .3s both}
.w1{animation:sp-wave 1.6s linear infinite}.w2{animation:sp-wave 1.1s linear infinite reverse}
.boat{animation:sp-sail 2.6s ease-out .05s both}
.boat g{transform-box:fill-box;transform-origin:center bottom;animation:sp-rock .5s ease-in-out infinite alternate}
.palm{transform-box:fill-box;transform-origin:50% 100%;animation:sp-sway 1s ease-in-out infinite alternate}
.gull{animation:sp-fly 2.2s linear both}.gull path{transform-box:fill-box;transform-origin:center;animation:sp-flap .22s ease-in-out infinite alternate}
.route{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw 1.1s ease-in-out .5s forwards}
.pin{animation:sp-drop .6s cubic-bezier(.3,1.6,.5,1) 1.35s both}
@keyframes sp-rise{0%{transform:translateY(140px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-slide{0%{transform:translateY(120px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-wave{to{transform:translateX(-160px)}}
@keyframes sp-sail{0%{transform:translateX(-120px)}100%{transform:translateX(560px)}}
@keyframes sp-rock{0%{transform:rotate(-5deg) translateY(0)}100%{transform:rotate(5deg) translateY(-5px)}}
@keyframes sp-sway{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
@keyframes sp-fly{0%{transform:translateX(-120px)}100%{transform:translateX(950px)}}
@keyframes sp-flap{0%{transform:scaleY(1)}100%{transform:scaleY(-.6)}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-drop{0%{transform:translateY(-220px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sp-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes sp-bob{50%{transform:translateY(-6px) rotate(1.2deg)}}
@keyframes sp-up{0%{opacity:0;transform:translateY(28px) scale(.8)}100%{opacity:1;transform:none}}
@keyframes sp-burst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(320deg) scale(.4)}}
@media (max-aspect-ratio:1/1){#splash svg.scene{top:auto;bottom:0;height:75vw}#splash .logo{top:34%;width:min(78vw,380px)}#splash .spark{top:34%}#splash .tag{bottom:auto;top:52%}#splash .wait{bottom:auto;top:calc(52% + 42px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .spark{display:none}}
</style>
</head><body><div id="splash" role="status" aria-label="Loading TRISIKSTI">

<script>
// Short intro every time the landing page is opened or reloaded. Other pages skip it.
(function(){var el=document.getElementById('splash'),t0=Date.now();
if(location.pathname!=='/'&&location.pathname!=='/index.html'){el.remove();return}
var done=false;function hide(){if(done)return;done=true;
// the circle opens on the green "0" of the logo and grows until the landing page fills the screen
var img=el.querySelector('.logo img'),r=img.getBoundingClientRect();el.style.setProperty('--cx',(r.left+r.width*.8)+'px');el.style.setProperty('--cy',(r.top+r.height*.45)+'px');
var iris=window.CSS&&CSS.supports&&CSS.supports('mask-image','radial-gradient(circle,transparent 0,#000 1px)')&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
el.classList.add(iris?'out':'fade');setTimeout(function(){el.remove()},iris?2200:500)}
// The loading screen stays until the whole page is ready: the intro has played, the app is drawn, the page and fonts have loaded,
// no data requests are still running, and the pictures on screen have finished. A safety limit stops it hanging on a dead connection.
var MIN=2500,MAX=20000,rendered=false,pending=0,quietAt=Date.now(),fontsOk=!(document.fonts&&document.fonts.ready);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fontsOk=true},function(){fontsOk=true});
if(window.fetch){var f=window.fetch;window.fetch=function(){pending++;var d=function(){pending--;quietAt=Date.now()},q=f.apply(this,arguments);q.then(d,d);return q}}
function picsReady(){var im=document.querySelectorAll('#root img'),h=innerHeight;for(var i=0;i<im.length;i++){var x=im[i],r=x.getBoundingClientRect();if(r.bottom<0||r.top>h)continue;if(x.getAttribute('src')&&!x.complete)return false}return true}
function ready(){return rendered&&document.readyState==='complete'&&fontsOk&&pending===0&&Date.now()-quietAt>500&&picsReady()}
window.__hideSplash=function(){rendered=true;quietAt=Date.now()};
var tick=setInterval(function(){var age=Date.now()-t0;if(done){clearInterval(tick);return}if(age>=MAX||(age>=MIN&&ready())){clearInterval(tick);hide()}},120);})();
</script>
